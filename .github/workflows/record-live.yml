# Live recorder: 60-second Sleeper snapshots (delay mode) plus highlight
# resolution on the same loop, running for as long as there are live games.
#
# This is the only path that delivers a real per-minute cadence. Cron cannot:
# GitHub drops most scheduled runs on a quiet repo and delivers the rest hours
# late. The previous design took the two candidate triggers (16:00/17:00 UTC)
# and no-opped unless the local hour was exactly 17 — so on 2026-09-13 the
# deliveries at 19:34 and 20:16 UK were both rejected and the entire Sunday
# slate went unrecorded.
#
# Now the job decides for itself from the week's actual games
# (js/schedule.js): a late delivery finds the window already open and starts
# recording, and an early one sleeps until it opens instead of exiting. That
# makes the *timing* of a delivery irrelevant — only that one lands at all —
# which is why the schedule below is simply a spread of candidates through the
# day rather than an attempt to hit kickoff. A candidate with no window in
# reach exits in seconds.
#
# Runs longer than a job's 6-hour cap are covered by chaining: each leg stops
# at ~5h20m and dispatches the next (see scripts/record-live.js).

name: Record live-window snapshots (60s)

on:
  workflow_dispatch:
    inputs:
      leg:
        description: 'Leg number (1 to start; higher values are continuations)'
        default: '1'
  schedule:
    - cron: '*/30 * * 1,9-12 *' # candidates all season; each no-ops off-window

permissions:
  contents: write
  actions: write # each leg dispatches the next via the Actions API

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~5h50m; record-live.js self-limits each leg to ~5h20m,
                         # counted from process start so a pre-window wait is included
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run live recorder
        env:
          SLEEPER_USERNAME: AlastairL
          GITHUB_TOKEN: ${{ github.token }}
          # The loop resolves highlight links every other tick. This job holds
          # the `snapshots` concurrency group for the whole window, so without
          # the key here nothing could resolve a game until the job ended.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/record-live.js /tmp/snapshot-data "${{ github.event.inputs.leg || '1' }}"
