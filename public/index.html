<!DOCTYPE html>
<html lang="en">
<head>

  <div id="settings" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span>League Office</span>
        <button id="closeSettings" class="modal-x" aria-label="Close">&times;</button>
      </div>
      <p class="modal-note">Load a fresh <b>all-weeks.csv</b> or any generated JSON to preview locally. Nothing leaves your phone; commit it to <code>public/data</code> to keep it.</p>
      <label class="modal-file">
        <input id="fileinput" type="file" accept=".csv,.json" hidden/>
        <span>Choose data file…</span>
      </label>
      <div class="modal-foot">Plancy positive since 2025.</div>
    </div>
  </div>

  <div id="dots" class="dots"></div>
  <main id="deck" class="deck"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
