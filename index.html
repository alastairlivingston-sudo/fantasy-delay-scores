<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Spoiler-Safe Sleeper Scores</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sleeper Safe">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Setup view -->
    <section id="view-setup" hidden>
      <div class="setup-card">
        <h1>🏈 Spoiler-Safe<br>Sleeper Scores</h1>
        <p class="sub">Watch on UK delay without getting spoiled.</p>
        <label for="username">Sleeper username</label>
        <input id="username" type="text" autocomplete="username" autocapitalize="none" placeholder="e.g. AlastairL">
        <button id="btn-connect" class="primary">Connect</button>
        <div id="setup-leagues" class="league-list"></div>
        <p id="setup-error" class="error" hidden></p>
      </div>
    </section>

    <!-- Spoiler-mode choice view -->
    <section id="view-mode" hidden>
      <div class="setup-card">
        <h1>How do you want to watch?</h1>
        <p class="sub">Pick how the app should protect you from spoilers. You can change this anytime from the main screen.</p>
        <div class="league-list" id="mode-choices" role="radiogroup" aria-label="Spoiler mode">
          <button data-mode="watched">
            <span>Watched games</span>
            <span class="meta">Tick off games as you watch them; only ticked games count.</span>
          </button>
          <button data-mode="delay">
            <span>Delay</span>
            <span class="meta">Show scores as they were a set number of minutes ago, with a live-safe points feed.</span>
          </button>
        </div>
        <div id="mode-delay-controls" class="delay-controls" hidden>
          <label for="mode-delay-select">Behind live by</label>
          <select id="mode-delay-select">
            <option value="2" selected>2 min</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60">60 min</option>
            <option value="90">90 min</option>
            <option value="120">2 hours</option>
          </select>
        </div>
        <button id="btn-mode-confirm" class="primary">Continue</button>
      </div>
    </section>

    <!-- Main view -->
    <section id="view-main" hidden>
      <header>
        <div class="header-row">
          <button id="btn-menu" class="ghost" aria-label="Menu">☰</button>
          <span id="league-name" class="league-name"></span>
          <span id="mode-indicator" class="mode-indicator"></span>
        </div>
      </header>

      <div id="notice" class="notice" hidden></div>

      <div id="tab-matchup" class="tab">
        <div id="scorecard" class="scorecard"></div>
        <div id="winprob" class="winprob"></div>
        <div id="starters" class="starters"></div>
      </div>

      <div id="tab-games" class="tab" hidden>
        <p class="hint" id="games-hint"></p>
        <p class="hint" id="highlights-checked"></p>
        <div id="games-list" class="games-list"></div>
      </div>

      <div id="tab-news" class="tab" hidden>
        <p class="hint" id="news-hint"></p>
        <div id="news-feed" class="news-feed"></div>
      </div>

      <nav class="bottom-nav">
        <button data-tab="matchup" class="active">Matchup</button>
        <button data-tab="games">Games &amp; Highlights</button>
        <button data-tab="news" hidden>News flash</button>
      </nav>
    </section>

    <!-- Slide-in menu (mode, week, default, league/user) -->
    <div id="drawer" class="drawer" hidden>
      <div class="drawer-scrim" data-close></div>
      <aside class="drawer-panel">
        <div class="drawer-head">
          <h2>Menu</h2>
          <button class="ghost" data-close aria-label="Close menu">✕</button>
        </div>

        <div class="drawer-section">
          <span class="drawer-label">Spoiler mode</span>
          <div class="mode-switch" role="tablist" aria-label="Spoiler mode">
            <button data-mode="watched" role="tab">Watched</button>
            <button data-mode="delay" role="tab">Delay</button>
          </div>
          <div id="delay-controls" class="delay-controls" hidden>
            <label for="delay-select">Behind live by</label>
            <select id="delay-select">
              <option value="2">2 min</option>
              <option value="15">15 min</option>
              <option value="30">30 min</option>
              <option value="45">45 min</option>
              <option value="60">60 min</option>
              <option value="90">90 min</option>
              <option value="120">2 hours</option>
            </select>
          </div>
        </div>

        <div class="drawer-section">
          <label class="drawer-label" for="week-select">Week</label>
          <select id="week-select" aria-label="Week"></select>
        </div>

        <div class="drawer-section">
          <button id="btn-set-default" class="secondary">Make this my default</button>
          <p id="default-hint" class="drawer-hint"></p>
        </div>

        <div class="drawer-section">
          <button id="btn-settings" class="secondary">Change league or username</button>
        </div>
      </aside>
    </div>

    <div id="loading" class="loading" hidden>Loading…</div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
